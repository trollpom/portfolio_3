[build]
  command = "pnpm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify automatically enables the current OpenNext adapter for Next.js.
# Do not add a static SPA catch-all: the adapter owns page and API routing.

[[headers]]
  for = "/api/rsvp*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
